name: Build Multi-Tenant Android Apps

on:
  repository_dispatch:
    types: [build-app]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # Required to create GitHub Releases

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Debug Workspace Code
      run: |
        echo "=== Current Git Commit ==="
        git log -n 3
        echo "=== Checking main.dart for CONNECT ==="
        grep -n "CONNECT" flutter_app_template/lib/main.dart || echo "No CONNECT found in template main.dart"
        echo "=== Checking settings.gradle ==="
        cat flutter_app_template/android/settings.gradle

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Generate Gradle Wrapper for Template
      run: |
        flutter create --platforms=android temp_gradle_project
        cp -r temp_gradle_project/android/gradle flutter_app_template/android/
        cp temp_gradle_project/android/gradlew flutter_app_template/android/
        cp temp_gradle_project/android/gradlew.bat flutter_app_template/android/
        rm -rf temp_gradle_project
        sed -i -E 's/gradle-[0-9.]+(-all|-bin)\.zip/gradle-8.14.5-all.zip/g' flutter_app_template/android/gradle/wrapper/gradle-wrapper.properties

    - name: Flutter Doctor (Debug Info)
      run: flutter doctor -v

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm ci

    - name: Accept Android Licenses
      run: yes | flutter doctor --android-licenses || true

    - name: Run Build Tenant App Script
      run: |
        VERSION_ARG=""
        if [ -n "${{ github.event.client_payload.versionCode }}" ]; then
          VERSION_ARG="--version-code=${{ github.event.client_payload.versionCode }}"
        fi
        if [ -n "${{ github.event.client_payload.versionName }}" ]; then
          VERSION_ARG="$VERSION_ARG --version-name=${{ github.event.client_payload.versionName }}"
        fi
        node scripts/build-tenant-app.js ${{ github.event.client_payload.shopSlug }} --github-actions $VERSION_ARG
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
        FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_OWNER: ${{ github.repository_owner }}
        GITHUB_REPO: webmaa

    - name: Commit & Push Version Code Updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add scripts/app-versions.json
        if git diff-index --quiet HEAD; then
          echo "No version code changes to commit."
        else
          git commit -m "chore: auto-increment app version code [skip ci]"
          # Retry push with rebase to handle concurrent builds
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
